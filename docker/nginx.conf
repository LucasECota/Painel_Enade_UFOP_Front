# Nginx do container do site: serve os arquivos do React e repassa /api/ para o container "api".
# (HTTPS fica a cargo de quem está na frente: a TI ou um proxy com certificado.)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # arquivos com hash no nome nunca mudam: cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # a API (container "api", porta 3000)
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    # qualquer outra rota do site (/dados, /preparatorio...) devolve o index.html;
    # sem isso, apertar F5 numa página dá erro 404
    location / {
        try_files $uri /index.html;
    }
}
